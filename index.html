<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="javascript/script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="screen">
            <p class="res">0</p>
        </div>

        <div class="btn-container">
            <div class="btn-row">
                <button>CLEAR</button>
                <button>DELETE</button>
            </div>

            <div class="btn-row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>÷</button>
            </div>

            <div class="btn-row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>x</button>
            </div>

            <div class="btn-row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>-</button>
            </div>

            <div class="btn-row">
                <button>.</button>
                <button>0</button>
                <button>=</button>
                <button>+</button>
            </div>
        </div>
    </div>
</body>
</html>
